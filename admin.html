<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biswa Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe0ec, #fff5f8);
      padding: 30px 15px;
      color: #333;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    .box {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
      margin-bottom: 20px;
    }

    h1 {
      text-align: center;
      color: #e91e63;
      margin-top: 0;
    }

    h2 {
      color: #e91e63;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #e91e63;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #d81b60;
    }

    #dashboard {
      display: none;
    }

    .answer {
      background: #fff4f8;
      border-left: 5px solid #e91e63;
      border-radius: 12px;
      padding: 15px;
      margin: 12px 0;
    }

    .answer strong {
      color: #e91e63;
    }

    .percent {
      font-size: 28px;
      font-weight: bold;
      color: #e91e63;
    }

    .time {
      color: #777;
      font-size: 13px;
      margin-top: 7px;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }

    .success {
      color: green;
      text-align: center;
      margin-top: 10px;
    }

    .logout {
      background: #555;
    }

    .logout:hover {
      background: #333;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div class="box" id="loginBox">
    <h1>🔐 Biswa Admin</h1>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <div id="loginMessage"></div>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboard">

    <div class="box">
      <h1>💗 Biswa Responses</h1>

      <button onclick="loadAnswers()">🔄 Refresh Responses</button>
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="box">
      <h2>Responses</h2>

      <div id="answers">
        Loading...
      </div>
    </div>

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://kqkajesczdosciafnskh.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_toqJwHACx2aQPig2D6zivw_GfAIvbfu";


  // LOGIN
  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");

    message.innerHTML = "";

    if (!email || !password) {
      message.innerHTML =
        '<div class="error">Email aur password enter karo.</div>';
      return;
    }

    try {

      const response = await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error_description ||
          data.msg ||
          "Login failed"
        );
      }

      localStorage.setItem(
        "biswaAdminSession",
        JSON.stringify(data)
      );

      showDashboard();

    } catch (error) {

      message.innerHTML =
        '<div class="error">' +
        error.message +
        '</div>';
    }
  }


  // SHOW DASHBOARD
  function showDashboard() {

    document.getElementById("loginBox").style.display =
      "none";

    document.getElementById("dashboard").style.display =
      "block";

    loadAnswers();
  }


  // LOAD ANSWERS
  async function loadAnswers() {

    const answersBox =
      document.getElementById("answers");

    const session =
      JSON.parse(
        localStorage.getItem("biswaAdminSession")
      );

    if (!session || !session.access_token) {
      logout();
      return;
    }

    answersBox.innerHTML = "Loading...";

    try {

      const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/biswa_answers" +
        "?select=love_answer,love_amount,created_at" +
        "&order=created_at.desc",
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + session.access_token
          }
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Could not load responses"
        );
      }

      if (!data.length) {

        answersBox.innerHTML =
          "<p>No responses yet 💗</p>";

        return;
      }

      answersBox.innerHTML = "";

      data.forEach((item, index) => {

        const answerDiv =
          document.createElement("div");

        answerDiv.className = "answer";

        const loveAnswer =
          escapeHTML(item.love_answer);

        const loveAmount =
          Number(item.love_amount);

        const date =
          new Date(item.created_at)
          .toLocaleString("en-IN");

        answerDiv.innerHTML = `
          <div>
            <strong>Response ${index + 1}</strong>
          </div>

          <p>
            <strong>Do you love me?</strong><br>
            ${loveAnswer}
          </p>

          <p>
            <strong>How much do you love me?</strong>
          </p>

          <div class="percent">
            ${loveAmount}%
          </div>

          <div class="time">
            🕒 ${date}
          </div>
        `;

        answersBox.appendChild(answerDiv);
      });

    } catch (error) {

      answersBox.innerHTML =
        '<div class="error">' +
        error.message +
        '</div>';
    }
  }


  // LOGOUT
  async function logout() {

    const session =
      JSON.parse(
        localStorage.getItem("biswaAdminSession")
      );

    if (session && session.access_token) {

      try {

        await fetch(
          SUPABASE_URL + "/auth/v1/logout",
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + session.access_token
            }
          }
        );

      } catch (error) {
        console.log(error);
      }
    }

    localStorage.removeItem(
      "biswaAdminSession"
    );

    document.getElementById("dashboard").style.display =
      "none";

    document.getElementById("loginBox").style.display =
      "block";

    document.getElementById("password").value = "";

    document.getElementById("loginMessage").innerHTML = "";
  }


  // HTML SECURITY
  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text ?? "";

    return div.innerHTML;
  }


  // CHECK EXISTING LOGIN
  window.addEventListener("load", function() {

    const session =
      JSON.parse(
        localStorage.getItem("biswaAdminSession")
      );

    if (
      session &&
      session.access_token
    ) {

      showDashboard();

    }

  });

</script>

</body>
</html>
